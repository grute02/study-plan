<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src https://api.github.com/repos/grute02/study-plan-data https://api.github.com/repos/grute02/study-plan-data/; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>공부 플랜</title>
<style>
:root{--bg:#fff;--text:#191f28;--text-2:#4e5968;--text-3:#5b6572;--line:#e5e8eb;--card:#f2f4f6;--field:#f9fafb;--blue:#1b64da;--blue-press:#1957c2;--red:#d22030;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#17171c;--text:#f9fafb;--text-2:#c3c9d0;--text-3:#9ea7b1;--line:#2c2c35;--card:#22222a;--field:#202027;--blue:#3182f6;--blue-press:#1b64da;--red:#ff6b77;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:48px 20px 48px}
h1{font-size:24px;line-height:1.35;margin:0 0 10px;letter-spacing:-.02em}
h1:focus{outline:none}
p{color:var(--text-2);font-size:15px;line-height:1.6;margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;color:var(--text-3);margin:26px 0 8px}
input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px;padding:0 14px;font-family:ui-monospace,Consolas,monospace}
input.code{font-size:22px;letter-spacing:.18em;text-transform:uppercase;text-align:center}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{display:block;width:100%;height:56px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-top:14px;cursor:pointer;font-family:inherit}
.btn:active{background:var(--blue-press)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn2{background:var(--card);color:var(--text)}
.btn2:active{background:var(--line)}
.msg{min-height:22px;font-size:14px;line-height:1.5;color:var(--red);margin:12px 0 0}
.note{background:var(--card);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:var(--text);margin:18px 0 0}
details{margin-top:24px;background:var(--card);border-radius:14px;padding:14px 16px}
summary{cursor:pointer;font-weight:600;font-size:15px}
ol{padding-left:20px;margin:12px 0 4px;color:var(--text);font-size:14px;line-height:1.75}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
a{color:var(--blue)}
.qr{background:#fff;border-radius:16px;padding:12px;display:flex;justify-content:center;margin:20px auto 12px;max-width:340px}
.qr svg{display:block;width:100%;height:auto}
.pin{font:700 30px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-align:center;margin:6px 0 4px;color:var(--text)}
.small{font-size:13px;color:var(--text-3)}
.center{text-align:center;padding-top:30vh;color:var(--text-3);font-size:15px}
</style>
</head>
<body>
<main id="app"><p class="center" role="status" aria-live="polite">불러오는 중…</p></main>
<script>
/* Minimal QR Code encoder: byte mode, versions 1-15, error correction L/M.
 * ES5, no dependencies. Exposes two globals: qrEncode(text, ecl) and qrSvg(text, opts).
 * qrEncode(text, ecl) -> { size, version, mask, get(x, y) -> boolean }  (x = column, y = row)
 * The optional third argument { version, mask } forces either value (used by tests). */
function qrEncode(text, ecl, force) {
  ecl = String(ecl || "M").toUpperCase();
  force = force || {};
  // Per version 1..15: [EC codewords per block, group1 blocks, group1 data cw, group2 blocks, group2 data cw]
  var EC = {
    L: [[7, 1, 19, 0, 0], [10, 1, 34, 0, 0], [15, 1, 55, 0, 0], [20, 1, 80, 0, 0], [26, 1, 108, 0, 0],
        [18, 2, 68, 0, 0], [20, 2, 78, 0, 0], [24, 2, 97, 0, 0], [30, 2, 116, 0, 0], [18, 2, 68, 2, 69],
        [20, 4, 81, 0, 0], [24, 2, 92, 2, 93], [26, 4, 107, 0, 0], [30, 3, 115, 1, 116], [22, 5, 87, 1, 88]],
    M: [[10, 1, 16, 0, 0], [16, 1, 28, 0, 0], [26, 1, 44, 0, 0], [18, 2, 32, 0, 0], [24, 2, 43, 0, 0],
        [16, 4, 27, 0, 0], [18, 4, 31, 0, 0], [22, 2, 38, 2, 39], [22, 3, 36, 2, 37], [26, 4, 43, 1, 44],
        [30, 1, 50, 4, 51], [22, 6, 36, 2, 37], [22, 8, 37, 1, 38], [24, 4, 40, 5, 41], [24, 5, 41, 5, 42]]
  };
  if (!EC[ecl]) throw new Error("qrEncode: ecl must be \"L\" or \"M\"");
  var i, j, k, x, y;

  // --- Text to UTF-8 bytes ---
  var bin = unescape(encodeURIComponent(String(text))), bytes = [];
  for (i = 0; i < bin.length; i++) bytes.push(bin.charCodeAt(i));

  // --- Pick the smallest version that fits ---
  var ver, t, dataCw;
  for (ver = force.version || 1; ver <= 15; ver++) {
    t = EC[ecl][ver - 1];
    dataCw = t[1] * t[2] + t[3] * t[4];
    if (4 + (ver < 10 ? 8 : 16) + 8 * bytes.length <= dataCw * 8) break;
    if (force.version) ver = 16;
  }
  if (ver > 15) throw new Error("qrEncode: data too long (" + bytes.length + " bytes) for QR version 15-" + ecl);

  // --- Bit stream: mode 0100, count, data, terminator, byte align, pad bytes ---
  var bits = [];
  function put(val, len) { for (var b = len - 1; b >= 0; b--) bits.push((val >>> b) & 1); }
  put(4, 4);
  put(bytes.length, ver < 10 ? 8 : 16);
  for (i = 0; i < bytes.length; i++) put(bytes[i], 8);
  put(0, Math.min(4, dataCw * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  for (k = 0xEC; bits.length < dataCw * 8; k ^= 0xEC ^ 0x11) put(k, 8);
  var cw = [];
  for (i = 0; i < bits.length; i += 8) {
    for (k = 0, j = 0; j < 8; j++) k = (k << 1) | bits[i + j];
    cw.push(k);
  }

  // --- Reed-Solomon over GF(256), primitive polynomial 0x11D ---
  var EXP = [], LOG = [];
  for (i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
  function mul(a, b) { return a && b ? EXP[(LOG[a] + LOG[b]) % 255] : 0; }
  var nEc = t[0], gen = [], root = 1;
  for (i = 0; i < nEc; i++) gen.push(i === nEc - 1 ? 1 : 0);
  for (i = 0; i < nEc; i++) { // multiply by (x - alpha^i); leading 1 is implicit
    for (j = 0; j < nEc; j++) { gen[j] = mul(gen[j], root); if (j + 1 < nEc) gen[j] ^= gen[j + 1]; }
    root = mul(root, 2);
  }
  function ecFor(data) {
    var r = [], f, a, b;
    for (a = 0; a < nEc; a++) r.push(0);
    for (a = 0; a < data.length; a++) {
      f = data[a] ^ r.shift();
      r.push(0);
      for (b = 0; b < nEc; b++) r[b] ^= mul(gen[b], f);
    }
    return r;
  }

  // --- Split into blocks, compute EC, interleave ---
  var blocks = [], ecs = [], off = 0, nBlocks = t[1] + t[3], len;
  for (i = 0; i < nBlocks; i++) {
    len = i < t[1] ? t[2] : t[4];
    blocks.push(cw.slice(off, off + len));
    ecs.push(ecFor(blocks[i]));
    off += len;
  }
  var all = [];
  for (i = 0; i < Math.max(t[2], t[4]); i++)
    for (j = 0; j < nBlocks; j++) if (i < blocks[j].length) all.push(blocks[j][i]);
  for (i = 0; i < nEc; i++)
    for (j = 0; j < nBlocks; j++) all.push(ecs[j][i]);

  // --- Function patterns ---
  var size = ver * 4 + 17, mod = [], fn = [];
  for (i = 0; i < size * size; i++) { mod.push(0); fn.push(0); }
  function set(px, py, dark) { mod[py * size + px] = dark ? 1 : 0; fn[py * size + px] = 1; }
  for (i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); } // timing
  var corners = [[3, 3], [size - 4, 3], [3, size - 4]];
  for (k = 0; k < 3; k++) // finders + separators
    for (y = -4; y <= 4; y++) for (x = -4; x <= 4; x++) {
      var fx = corners[k][0] + x, fy = corners[k][1] + y, d = Math.max(Math.abs(x), Math.abs(y));
      if (fx >= 0 && fy >= 0 && fx < size && fy < size) set(fx, fy, d !== 2 && d !== 4);
    }
  var al = [];
  if (ver > 1) { // alignment pattern centres
    var nAl = Math.floor(ver / 7) + 2, step = Math.ceil((ver * 4 + 4) / (nAl * 2 - 2)) * 2;
    for (i = 0, k = size - 7; i < nAl - 1; i++, k -= step) al.unshift(k);
    al.unshift(6);
  }
  for (i = 0; i < al.length; i++) for (j = 0; j < al.length; j++) {
    if ((i === 0 && j === 0) || (i === 0 && j === al.length - 1) || (i === al.length - 1 && j === 0)) continue;
    for (y = -2; y <= 2; y++) for (x = -2; x <= 2; x++)
      set(al[i] + x, al[j] + y, Math.max(Math.abs(x), Math.abs(y)) !== 1);
  }
  function drawFormat(mask) { // 15-bit format info (BCH), both copies, plus dark module
    var data = ((ecl === "L" ? 1 : 0) << 3) | mask, rem = data, b;
    for (b = 0; b < 10; b++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    var f = ((data << 10) | rem) ^ 0x5412;
    for (b = 0; b < 15; b++) {
      var bit = (f >>> b) & 1;
      if (b < 6) set(8, b, bit); else if (b < 8) set(8, b + 1, bit); else set(8, size - 15 + b, bit);
      if (b < 8) set(size - 1 - b, 8, bit); else if (b < 9) set(7, 8, bit); else set(14 - b, 8, bit);
    }
    set(8, size - 8, 1);
  }
  drawFormat(0); // reserve
  if (ver >= 7) { // 18-bit version info (BCH)
    var rv = ver;
    for (i = 0; i < 12; i++) rv = (rv << 1) ^ ((rv >>> 11) * 0x1F25);
    var vb = (ver << 12) | rv;
    for (i = 0; i < 18; i++) {
      set(size - 11 + i % 3, Math.floor(i / 3), (vb >>> i) & 1);
      set(Math.floor(i / 3), size - 11 + i % 3, (vb >>> i) & 1);
    }
  }

  // --- Place data in the zigzag order (remainder bits stay 0) ---
  for (k = 0, x = size - 1; x >= 1; x -= 2) {
    if (x === 6) x = 5;
    for (var vert = 0; vert < size; vert++) for (j = 0; j < 2; j++) {
      var cx = x - j, cy = ((x + 1) & 2) === 0 ? size - 1 - vert : vert, idx = cy * size + cx;
      if (fn[idx]) continue;
      mod[idx] = k < all.length * 8 ? (all[k >>> 3] >>> (7 - (k & 7))) & 1 : 0;
      k++;
    }
  }

  // --- Masks and penalty scoring ---
  function maskHit(m, c, r) {
    switch (m) {
      case 0: return (r + c) % 2 === 0;
      case 1: return r % 2 === 0;
      case 2: return c % 3 === 0;
      case 3: return (r + c) % 3 === 0;
      case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
      case 5: return (r * c) % 2 + (r * c) % 3 === 0;
      case 6: return ((r * c) % 2 + (r * c) % 3) % 2 === 0;
      default: return ((r + c) % 2 + (r * c) % 3) % 2 === 0;
    }
  }
  function masked(m) {
    drawFormat(m);
    var g = mod.slice();
    for (var r = 0; r < size; r++) for (var c = 0; c < size; c++)
      if (!fn[r * size + c] && maskHit(m, c, r)) g[r * size + c] ^= 1;
    return g;
  }
  function penalty(g) {
    var p = 0, dark = 0, h, a, b, v, run, prev, win;
    for (h = 0; h < 2; h++) for (a = 0; a < size; a++) { // rows (h=0) then columns (h=1)
      run = 0; prev = -1; win = 0;
      for (b = 0; b < size; b++) {
        v = h ? g[b * size + a] : g[a * size + b];
        if (v === prev) run++; else { if (run >= 5) p += run - 2; run = 1; prev = v; } // rule 1
        win = ((win << 1) | v) & 0x7FF;
        if (b >= 10 && (win === 0x5D0 || win === 0x05D)) p += 40; // rule 3: 1:1:3:1:1 + 4 light
      }
      if (run >= 5) p += run - 2;
    }
    for (a = 0; a < size; a++) for (b = 0; b < size; b++) {
      v = g[a * size + b];
      dark += v;
      if (a < size - 1 && b < size - 1 && v === g[a * size + b + 1] &&
          v === g[(a + 1) * size + b] && v === g[(a + 1) * size + b + 1]) p += 3; // rule 2
    }
    return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10; // rule 4
  }
  var best = force.mask, penalties = [];
  if (best === undefined || best === null) {
    for (i = 0; i < 8; i++) {
      penalties.push(penalty(masked(i)));
      if (best === undefined || best === null || penalties[i] < penalties[best]) best = i;
    }
  }
  var grid = masked(best);
  return {
    size: size, version: ver, mask: best, penalties: penalties,
    get: function (gx, gy) {
      return gx >= 0 && gy >= 0 && gx < size && gy < size && grid[gy * size + gx] === 1;
    }
  };
}

/* qrSvg(text, opts) -> "<svg ...>" string. opts: { px: 256, dark: "#000", light: "#fff", ecl: "M" } */
function qrSvg(text, opts) {
  opts = opts || {};
  var q = qrEncode(text, opts.ecl || "M"), n = q.size + 8, px = opts.px || 256, d = "", x, y, run;
  for (y = 0; y < q.size; y++) for (x = 0; x < q.size; x++) {
    if (!q.get(x, y)) continue;
    for (run = 1; q.get(x + run, y); run++);
    d += "M" + (x + 4) + " " + (y + 4) + "h" + run + "v1h-" + run + "z";
    x += run; // module at x + run is light (or outside), skip it
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px +
    '" viewBox="0 0 ' + n + " " + n + '" shape-rendering="crispEdges">' +
    '<rect width="' + n + '" height="' + n + '" fill="' + (opts.light || "#fff") + '"/>' +
    '<path d="' + d + '" fill="' + (opts.dark || "#000") + '"/></svg>';
}

(function(){
  "use strict";
  /* 공개 GitHub Pages에 올라가는 껍데기. 플랜과 체크 기록은 비공개 저장소에 있고, 이 기기에 넣은 토큰으로만 읽는다.
     토큰은 localStorage "plan-gh-cfg"(플랜 페이지도 같은 값으로 기록을 저장), 받은 플랜은 "plan-gh-cache"에 둬서
     바뀌지 않았으면(304) 다시 받지 않고, 인터넷이 안 될 때도 마지막 플랜을 연다.
     폰 연결: PC가 토큰을 PC 화면의 확인 코드(8자)로 암호화해 QR(#e=…)로 보여 주고, 폰은 그 코드를 넣어 푼다.
     폰 방문 기록에는 암호문만 남는다. */
  var CFG = { api: "https://api.github.com", owner: "grute02", repo: "study-plan-data", branch: "main", plan: "plan.html" };
  var K_CFG = "plan-gh-cfg", K_CACHE = "plan-gh-cache";
  var app = document.getElementById("app"), started = false;
  function ls(k, v){
    try {
      if (v === undefined) return window.localStorage.getItem(k);
      if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v);
      return true;
    } catch(e){ return null; }
  }
  function cfgFor(t){ return { api: CFG.api, owner: CFG.owner, repo: CFG.repo, branch: CFG.branch, token: t }; }
  function isPat(t){ return /^github_pat_[A-Za-z0-9_]{20,}$/.test(t); }
  function savedToken(){ try { var c = JSON.parse(ls(K_CFG) || "null"); return c && typeof c.token === "string" && isPat(c.token) ? c.token : null; } catch(e){ return null; } }
  function saveToken(t){ ls(K_CFG, JSON.stringify(cfgFor(t))); return savedToken() === t; }
  function clearConn(){ ls(K_CFG, null); ls(K_CACHE, null); }
  function repoUrl(p){ return CFG.api.replace(/\/+$/, "") + "/repos/" + encodeURIComponent(CFG.owner) + "/" + encodeURIComponent(CFG.repo) + (p || ""); }
  function planUrl(){ return repoUrl("/contents/" + CFG.plan.split("/").map(encodeURIComponent).join("/")) + "?ref=" + encodeURIComponent(CFG.branch); }
  function hdr(t, raw){ return { "Authorization": "Bearer " + t, "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; }
  function get(url, headers, ms){   // 응답이 안 오면 ms 뒤에 포기(약한 신호·엘리베이터에서 멈춰 있지 않게)
    var ac = typeof AbortController === "function" ? new AbortController() : null, to = ac ? setTimeout(function(){ ac.abort(); }, ms || 15000) : 0;
    return fetch(url, { headers: headers, cache: "no-store", signal: ac ? ac.signal : undefined }).then(function(r){ clearTimeout(to); return r; }, function(e){ clearTimeout(to); throw e; });
  }
  function rateLimited(r){ return r.status === 429 || (r.status === 403 && (r.headers.get("retry-after") || r.headers.get("x-ratelimit-remaining") === "0")); }
  function el(tag, attrs, text){
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){ if (k === "class") n.className = attrs[k]; else n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function screen(title){
    app.innerHTML = ""; window.scrollTo(0, 0);
    var h = el("h1", { tabindex: "-1" }, title); app.appendChild(h);
    setTimeout(function(){ try { h.focus(); } catch(e){} }, 0);
    return app;
  }
  function bare(){ return location.pathname; }
  function para(text){ return el("p", null, text); }
  var MSG = {
    badToken: "토큰이 맞지 않아요. 다시 복사해서 붙여 넣어 주세요.",
    notPat: "github_pat_로 시작하는 Fine-grained 토큰만 쓸 수 있어요. ghp_·gho_ 토큰은 계정 전체를 열 수 있어서 받지 않아요.",
    noRepo: "이 토큰으로는 " + CFG.repo + " 저장소를 열 수 없어요. 토큰을 만들 때 Repository access에서 " + CFG.repo + "를 골랐는지 확인해 주세요.",
    noContents: "이 토큰에는 Contents 권한이 없어요. GitHub 토큰 설정의 Permissions에서 Contents를 Read and write로 바꿔 주세요. 토큰 값은 그대로 써도 돼요.",
    expired: "토큰이 만료됐거나 지워졌어요. 새 토큰을 넣어 주세요.",
    net: "인터넷 연결을 확인하고 다시 해 주세요.",
    gh: function(s){ return "GitHub이 지금 응답하지 않아요 (" + s + "). 잠시 뒤 다시 해 주세요."; },
    noStore: "이 브라우저에 연결 정보를 저장하지 못했어요(저장 공간 부족·쿠키 차단). 이번에는 열리지만 다음에 다시 넣어야 해요."
  };

  /* ---------- 플랜 열기 ---------- */
  function show(html, src, t){
    if (started) return; started = true;
    window.__PLAN_GH_CFG = cfgFor(t);   // 저장소에 못 써도 플랜이 연결 정보를 받게(창 전역은 document.open 뒤에도 남는다)
    window.__PLAN_SRC = src || { cached: false };
    document.open(); document.write(html); document.close();
  }
  function readCache(){ try { var c = JSON.parse(ls(K_CACHE) || "null"); return c && typeof c.html === "string" ? c : null; } catch(e){ return null; } }
  function writeCache(etag, html){ ls(K_CACHE, JSON.stringify({ etag: etag || "", html: html })); }
  function isHtml(h){ return /<html|<!doctype/i.test(String(h).slice(0, 400)); }
  /* 토큰으로 플랜을 받아 연다. first면 처음 연결(토큰을 저장하기 전 확인)이라 실패해도 저장된 것을 건드리지 않는다.
     성공하면 true, 아니면 보여 줄 문장을 돌려준다. */
  function load(t, first){
    var cache = first ? null : readCache();
    var h = hdr(t, true); if (cache && cache.etag) h["If-None-Match"] = cache.etag;
    return get(planUrl(), h, cache ? 4000 : 15000).then(function(r){
      if (r.status === 304 && cache) { show(cache.html, { cached: false, etag: cache.etag, path: CFG.plan }, t); return true; }
      if (r.status === 401) { if (!first) clearConn(); return MSG[first ? "badToken" : "expired"]; }
      if (r.status === 403 && !rateLimited(r)) return MSG.noContents;
      if (r.status === 404) {
        return get(repoUrl(""), hdr(t), 15000).then(function(r2){
          if (!r2.ok) return MSG.noRepo;
          if (first && !saveToken(t)) window.alert(MSG.noStore);
          message("아직 올라온 플랜이 없어요", "Claude에게 플랜을 GitHub에 올려 달라고 해 주세요. 올라오면 이 화면에서 「다시 열기」를 누르면 돼요.", true);
          return true;
        });
      }
      if (!r.ok) {
        if (cache) { show(cache.html, { cached: true, etag: cache.etag, path: CFG.plan }, t); return true; }
        return MSG.gh(r.status);
      }
      return r.text().then(function(html){
        if (!isHtml(html)) return "받은 플랜 파일이 이상해요. Claude에게 플랜을 다시 올려 달라고 해 주세요.";
        if (first) { ls(K_CACHE, null); if (!saveToken(t)) window.alert(MSG.noStore); }
        writeCache(r.headers.get("ETag"), html);
        show(html, { cached: false, etag: r.headers.get("ETag") || "", path: CFG.plan }, t);
        return true;
      });
    }).catch(function(){
      if (cache) { show(cache.html, { cached: true, etag: cache.etag, path: CFG.plan }, t); return true; }   // 인터넷이 안 되면 마지막으로 받은 플랜(새 플랜인지는 연결되면 확인)
      return MSG.net;
    });
  }
  function message(title, body, retry){
    var m = screen(title);
    m.appendChild(para(body));
    if (retry) { var b = el("button", { "class": "btn", type: "button" }, "다시 열기"); b.addEventListener("click", function(){ location.reload(); }); m.appendChild(b); }
    var b2 = el("button", { "class": "btn btn2", type: "button" }, "토큰 다시 넣기");
    b2.addEventListener("click", function(){ clearConn(); history.replaceState(null, "", bare()); setup(""); });
    m.appendChild(b2);
  }
  function openWith(t){
    load(t, false).then(function(res){ if (res !== true) { if (savedToken()) message("플랜을 불러오지 못했어요", res, true); else setup(res); } });
  }

  /* ---------- 처음 화면: 토큰 넣기 ---------- */
  function setup(msg){
    var m = screen("공부 플랜");
    var p = el("p"); p.appendChild(document.createTextNode("플랜과 체크 기록은 GitHub 비공개 저장소 "));
    p.appendChild(el("code", null, CFG.owner + "/" + CFG.repo)); p.appendChild(document.createTextNode("에 있어요. 이 기기에 한 번 연결하면 다음부터는 바로 열려요."));
    m.appendChild(p);
    m.appendChild(el("div", { "class": "note" }, "폰이라면: PC에서 플랜 맨 아래 「폰 연결하기」를 누르고, 화면의 QR을 폰 카메라로 찍은 다음 PC에 보이는 확인 코드를 넣어 주세요. 카카오톡·네이버 앱 스캐너 말고 기본 카메라로 찍어서 크롬·사파리에서 열어야 해요."));
    m.appendChild(el("label", { "for": "tok" }, "GitHub 토큰 (또는 연결 링크)"));
    var inp = el("input", { id: "tok", type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "github_pat_로 시작해요" });
    m.appendChild(inp);
    var go = el("button", { "class": "btn", type: "button", id: "go" }, "연결하기");
    m.appendChild(go);
    var out = el("p", { "class": "msg", id: "msg", role: "alert" }, msg || "");
    m.appendChild(out);
    var d = el("details"); d.appendChild(el("summary", null, "토큰 만드는 법 (PC에서 한 번)"));
    var ol = el("ol");
    var li1 = el("li"); li1.appendChild(el("a", { href: "https://github.com/settings/personal-access-tokens/new", target: "_blank", rel: "noopener noreferrer" }, "GitHub 새 토큰 만들기"));
    li1.appendChild(document.createTextNode(" 화면을 열어요 (Fine-grained token).")); ol.appendChild(li1);
    ol.appendChild(el("li", null, "Token name은 아무거나(예: study-plan), Expiration은 시험이 끝날 때까지 넉넉하게 정해요."));
    var li3 = el("li"); li3.appendChild(document.createTextNode("Repository access에서 Only select repositories를 고르고 ")); li3.appendChild(el("code", null, CFG.repo)); li3.appendChild(document.createTextNode(" 하나만 골라요.")); ol.appendChild(li3);
    ol.appendChild(el("li", null, "Permissions에서 Contents를 추가하고 Read and write로 해요. 다른 권한은 필요 없어요."));
    ol.appendChild(el("li", null, "Generate token을 누르고 나온 값(github_pat_…)을 복사해서 위 칸에 붙여 넣어요."));
    d.appendChild(ol);
    d.appendChild(el("p", { "class": "small" }, "토큰은 이 기기 브라우저에만 저장되고, 이 저장소 하나만 열 수 있어요. 공용 PC에서는 다 쓴 뒤 플랜 맨 아래 「이 기기 연결 끊기」를 눌러 주세요."));
    m.appendChild(d);
    var busy = false;
    function submit(){
      if (busy) return;
      var v = inp.value.trim();
      var link = /#e=([A-Za-z0-9_-]+)/.exec(v);
      if (link) { pairScreen(link[1]); return; }   // 홈 화면 앱·인앱 브라우저용: 연결 링크를 붙여 넣은 경우
      var t = v.replace(/\s+/g, "");
      if (!t) { out.textContent = "토큰을 붙여 넣어 주세요"; inp.focus(); return; }
      if (!isPat(t)) { out.textContent = MSG.notPat; inp.focus(); return; }
      busy = true; go.disabled = true; out.textContent = "확인하는 중…";
      load(t, true).then(function(res){
        if (res === true) return;
        busy = false; go.disabled = false; out.textContent = res; inp.focus();
      });
    }
    go.addEventListener("click", submit);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submit(); } });
  }

  /* ---------- 폰 연결: 확인 코드로 암호화한 토큰 ---------- */
  var ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";   // 헷갈리는 0·O·1·I·L 뺌 (31자)
  function newCode(){
    var out = "", b = new Uint8Array(1);
    while (out.length < 8) { crypto.getRandomValues(b); if (b[0] < 248) out += ALPHA[b[0] % 31]; }
    return out;
  }
  function b64u(u){ var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function unb64u(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function keyFrom(code, salt){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]).then(function(k){
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }
  function seal(token, code){
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    return keyFrom(code, salt).then(function(k){ return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, new TextEncoder().encode(token)); }).then(function(ct){
      var c = new Uint8Array(ct), all = new Uint8Array(28 + c.length); all.set(salt, 0); all.set(iv, 16); all.set(c, 28); return b64u(all);
    });
  }
  function unseal(payload, code){
    var all;
    try { all = unb64u(payload); } catch(e){ return Promise.reject(e); }
    if (all.length < 48) return Promise.reject(new Error("short"));
    return keyFrom(code, all.slice(0, 16)).then(function(k){ return crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(16, 28) }, k, all.slice(28)); })
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function pairScreen(payload){
    var m = screen("폰 연결하기");
    m.appendChild(para("PC 화면의 QR 아래에 보이는 확인 코드 8자리를 넣어 주세요."));
    m.appendChild(el("label", { "for": "pin" }, "확인 코드"));
    var inp = el("input", { id: "pin", "class": "code", type: "text", autocomplete: "off", autocapitalize: "characters", spellcheck: "false", maxlength: "12", placeholder: "ABCD-EFGH", inputmode: "text" });
    m.appendChild(inp);
    var go = el("button", { "class": "btn", type: "button", id: "pin-go" }, "연결하기"); m.appendChild(go);
    var out = el("p", { "class": "msg", id: "pin-msg", role: "alert" }, ""); m.appendChild(out);
    var other = el("button", { "class": "btn btn2", type: "button" }, "토큰을 직접 넣을게요");
    other.addEventListener("click", function(){ setup(""); }); m.appendChild(other);
    var busy = false;
    function submit(){
      if (busy) return;
      var code = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length !== 8) { out.textContent = "확인 코드는 8자리예요"; inp.focus(); return; }
      busy = true; go.disabled = true; out.textContent = "확인하는 중…";
      unseal(payload, code).then(function(t){
        if (!isPat(t)) { busy = false; go.disabled = false; out.textContent = "이 QR에는 쓸 수 없는 토큰이 들어 있어요. PC에서 새 토큰(github_pat_)으로 다시 연결한 뒤 QR을 만들어 주세요."; return; }
        return load(t, true).then(function(res){
          if (res === true) return;
          busy = false; go.disabled = false;
          out.textContent = res === MSG.badToken || res === MSG.expired ? "QR 속 연결 정보가 만료됐어요. PC에서 「폰 연결하기」를 다시 눌러 새 QR을 찍어 주세요." : res;
        });
      }, function(){
        busy = false; go.disabled = false; out.textContent = "코드가 맞지 않아요. PC 화면의 코드를 다시 확인해 주세요."; inp.focus();
      }).catch(function(){ busy = false; go.disabled = false; out.textContent = MSG.net; });
    }
    go.addEventListener("click", submit);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submit(); } });
    setTimeout(function(){ try { inp.focus(); } catch(e){} }, 50);
  }
  /* PC: 누르면 QR과 확인 코드를 보여 준다. 2분 뒤·페이지를 떠나면 지운다. */
  function connectScreen(t){
    var m = screen("폰 연결하기");
    m.appendChild(para("폰 카메라로 QR을 찍어 플랜을 열고, 폰에 이 화면의 확인 코드 8자리를 넣으면 폰도 같은 기록으로 연결돼요."));
    m.appendChild(el("p", { "class": "small" }, "화면 공유나 녹화 중이면 끄고 눌러 주세요. QR과 코드는 2분 뒤에 사라져요."));
    var box = el("div", { "class": "qr", role: "img", "aria-label": "폰 연결용 QR 코드" }); box.hidden = true; m.appendChild(box);
    var pin = el("p", { "class": "pin", id: "pin-code", "aria-live": "polite" }, ""); pin.hidden = true; m.appendChild(pin);
    var showBtn = el("button", { "class": "btn", type: "button", id: "qr-show" }, "QR 보이기"); m.appendChild(showBtn);
    var copyBtn = el("button", { "class": "btn btn2", type: "button" }, "연결 링크 복사"); copyBtn.hidden = true; m.appendChild(copyBtn);
    var out = el("p", { "class": "small", role: "status" }, ""); m.appendChild(out);
    var close = el("button", { "class": "btn btn2", type: "button", id: "qr-close" }, "닫고 플랜으로 돌아가기"); m.appendChild(close);
    m.appendChild(el("p", { "class": "small" }, "홈 화면에 추가한 앱이나 카카오톡·네이버 스캐너로 열면 저장 공간이 따로라서 연결이 안 될 수 있어요. 그럴 땐 「연결 링크 복사」로 링크를 보내 그 앱의 토큰 칸에 붙여 넣고 코드를 넣으면 돼요."));
    var timer = 0, link = "";
    function stillMine(){ return savedToken() === t; }
    function gone(){ hide(); location.replace(bare()); }
    window.addEventListener("pageshow", function(e){ if (e.persisted && !stillMine()) gone(); });
    window.addEventListener("storage", function(e){ if ((e.key === K_CFG || e.key === null) && !stillMine()) gone(); });
    function hide(){ clearTimeout(timer); box.innerHTML = ""; box.removeAttribute("data-link"); box.hidden = true; pin.textContent = ""; pin.hidden = true; copyBtn.hidden = true; link = ""; showBtn.hidden = false; showBtn.textContent = "QR 다시 보이기"; }
    showBtn.addEventListener("click", function(){
      if (!stillMine()) { gone(); return; }
      showBtn.disabled = true; out.textContent = "만드는 중…";
      var code = newCode();
      seal(t, code).then(function(payload){
        if (!stillMine()) { gone(); return; }
        link = location.origin + bare() + "#e=" + payload;
        box.innerHTML = qrSvg(link, { px: 320, ecl: "L" }); box.setAttribute("data-link", link);
        box.hidden = false; pin.textContent = code.slice(0, 4) + "-" + code.slice(4); pin.hidden = false;
        copyBtn.hidden = false; showBtn.hidden = true; showBtn.disabled = false; out.textContent = "";
        clearTimeout(timer); timer = setTimeout(hide, 120000);
      }).catch(function(){ showBtn.disabled = false; out.textContent = "QR을 만들지 못했어요. 이 브라우저가 암호화 기능을 지원하지 않아요."; });
    });
    copyBtn.addEventListener("click", function(){
      if (!link || !stillMine()) { gone(); return; }
      var done = function(){ out.textContent = "링크를 복사했어요. 확인 코드는 따로 직접 넣어야 해요."; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function(){ out.textContent = "복사하지 못했어요."; });
      else out.textContent = "이 브라우저는 복사를 지원하지 않아요.";
    });
    close.addEventListener("click", function(){
      hide();
      var back = false; try { back = !!window.sessionStorage.getItem("plan-qr-from"); window.sessionStorage.removeItem("plan-qr-from"); } catch(e){}
      if (back && history.length > 1) history.back(); else location.replace(bare());
    });
    window.addEventListener("pagehide", hide);
  }
  function confirmReset(){
    var m = screen("이 기기 연결 끊기");
    m.appendChild(para("이 기기에 저장된 토큰과 받아 둔 플랜을 지울까요? 다시 쓰려면 토큰을 넣거나 QR을 다시 찍어야 해요."));
    var yes = el("button", { "class": "btn", type: "button", id: "reset-yes" }, "연결 끊기");
    yes.addEventListener("click", function(){ clearConn(); setup("연결을 끊었어요. 토큰 자체는 GitHub 설정의 Fine-grained tokens에서 지워야 완전히 막혀요."); });
    var no = el("button", { "class": "btn btn2", type: "button", id: "reset-no" }, "그대로 두기");
    no.addEventListener("click", function(){ var t = savedToken(); if (t) { screen("공부 플랜"); openWith(t); } else setup(""); });
    m.appendChild(yes); m.appendChild(no);
  }

  /* ---------- 시작 ---------- */
  if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") { try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){} }   // 인터넷이 없어도 이 껍데기가 열리게
  window.addEventListener("hashchange", function(){ if (/^#e=/.test(location.hash)) location.reload(); });
  var q = new URLSearchParams(location.search), pair = null;
  if (/^#e=/.test(location.hash)) { pair = location.hash.slice(3); history.replaceState(null, "", bare()); }
  var tok = savedToken();
  if (!tok && ls(K_CFG)) clearConn();   // 예전에 넣은 ghp_·gho_ 토큰 등은 지우고 다시 넣게 한다
  if (pair && /^[A-Za-z0-9_-]{60,}$/.test(pair)) pairScreen(pair);
  else if (q.has("reset")) { history.replaceState(null, "", bare()); if (tok) confirmReset(); else setup(""); }
  else if (!tok) { if (location.search) history.replaceState(null, "", bare()); setup(""); }
  else if (q.has("connect")) {
    history.replaceState(null, "", bare());
    get(repoUrl(""), hdr(tok), 8000).then(function(r){
      if (r.status === 401) { clearConn(); setup("토큰이 만료됐어요. 새 토큰을 넣은 뒤 「폰 연결하기」를 다시 눌러 주세요."); }
      else connectScreen(tok);
    }, function(){ connectScreen(tok); });
  }
  else openWith(tok);
})();
</script>
